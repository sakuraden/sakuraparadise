name: Build SakuraParadise
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SakuraParadise-VST3
          path: build/SakuraParadise_artefacts/Release/VST3/
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SakuraParadise-EXE
          path: build/SakuraParadise_artefacts/Release/Standalone/
